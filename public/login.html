<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ingresar — Petición de Cambio de Domicilio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card" style="width: 100%; max-width: 380px;">
      <div class="card-body">
        <div class="text-center mb-3">
          <img src="/img/logo-municipal.png" alt="Municipalidad de Valparaíso" style="max-height:64px;" />
          <h1 class="h5 mt-3 mb-0">Cambio de domicilio</h1>
          <div class="text-muted" style="font-size:.8rem;">Depto. Licencias de Conducir</div>
        </div>
        <form id="form-login">
          <div class="mb-2">
            <label class="form-label">Usuario</label>
            <input type="text" name="usuario" class="form-control" required autofocus />
          </div>
          <div class="mb-3">
            <label class="form-label">Clave / PIN</label>
            <input type="password" name="clave" class="form-control" required />
          </div>
          <div id="error-login" class="alert alert-danger py-2" style="display:none;font-size:.82rem;"></div>
          <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
      </div>
    </div>
  </div>
  <script type="module">
    const form = document.getElementById('form-login');
    const error = document.getElementById('error-login');
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      error.style.display = 'none';
      const datos = Object.fromEntries(new FormData(form));
      try {
        await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos),
        }).then(async (res) => {
          if (!res.ok) {
            const cuerpo = await res.json().catch(() => ({}));
            throw new Error(cuerpo.error || 'Usuario o clave incorrectos');
          }
        });
        window.location.href = '/index.html';
      } catch (err) {
        error.textContent = err.message;
        error.style.display = 'block';
      }
    });
  </script>
</body>
</html>
