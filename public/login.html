<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ingresar — Petición de Cambio de Domicilio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
  <div class="login-shell">
    <section class="login-brand" aria-hidden="true">
      <span class="login-brand__stripes"></span>
      <img class="login-brand__logo" src="/img/logo-municipal.png" alt="" />
      <p class="login-brand__eyebrow">Municipalidad de Valparaíso</p>
      <h1 class="login-brand__title">Dirección de Tránsito<br />Cambio de Domicilio</h1>
      <p class="login-brand__subtitle">Peticiones de carpeta entre comunas · Decreto 170, art. 14</p>
    </section>

    <div class="login-panel">
      <div class="login-card">
        <h2 class="login-card__heading">Ingresar</h2>
        <p class="login-card__lead">Sistema de Cambio de Domicilio — Dirección de Tránsito</p>

        <form id="form-login" novalidate>
          <div class="login-field">
            <label for="usuario-login">Usuario</label>
            <div class="login-field__control">
              <span class="login-field__icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input
                type="text"
                id="usuario-login"
                name="usuario"
                required
                autofocus
                autocomplete="username"
                aria-required="true"
              />
            </div>
          </div>

          <div class="login-field">
            <label for="clave-login">Clave / PIN</label>
            <div class="login-field__control">
              <span class="login-field__icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input
                type="password"
                id="clave-login"
                name="clave"
                required
                autocomplete="current-password"
                aria-required="true"
              />
              <button type="button" id="btn-toggle-clave-login" class="login-field__toggle" aria-label="Mostrar clave" aria-pressed="false"></button>
            </div>
          </div>

          <div id="error-login" class="login-error" role="alert" style="display:none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="error-login-mensaje"></span>
          </div>

          <button type="submit" id="btn-submit-login" class="login-submit">Ingresar</button>
        </form>

        <p class="login-card__footer">Acceso restringido a personal autorizado</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { montarToggleClave } from '/js/passwordToggle.js';

    const form = document.getElementById('form-login');
    const error = document.getElementById('error-login');
    const errorMensaje = document.getElementById('error-login-mensaje');
    const btnSubmit = document.getElementById('btn-submit-login');
    const textoSubmitOriginal = btnSubmit.textContent;

    montarToggleClave(document.getElementById('clave-login'), document.getElementById('btn-toggle-clave-login'));

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      error.style.display = 'none';
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Ingresando…';
      const datos = Object.fromEntries(new FormData(form));
      try {
        await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos),
        }).then(async (res) => {
          if (!res.ok) {
            const cuerpo = await res.json().catch(() => ({}));
            throw new Error(cuerpo.error || 'Usuario o clave incorrectos');
          }
        });
        window.location.href = '/index.html';
      } catch (err) {
        errorMensaje.textContent = err.message;
        error.style.display = 'flex';
        btnSubmit.disabled = false;
        btnSubmit.textContent = textoSubmitOriginal;
      }
    });
  </script>
</body>
</html>
