<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Estadísticas — Cambio de domicilio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="/index.html">
        <img src="/img/logo-municipal.png" alt="" style="height:32px;vertical-align:middle;margin-right:.5rem;" />
        Peticiones
      </a>
      <div class="d-flex align-items-center gap-2">
        <a class="nav-link" href="/index.html">Peticiones</a>
        <a class="nav-link" href="/comunas.html">Comunas</a>
        <a class="nav-link active" href="/estadisticas.html">Estadísticas</a>
        <a class="nav-link" href="/configuracion.html">Configuración</a>
      </div>
    </div>
  </nav>
  <main class="container">
    <h1 class="h4 mb-3">Estadísticas</h1>
    <div class="stat-row mb-4">
      <div class="stat-chip"><b class="num" id="s-total">0</b><span>Total</span></div>
      <div class="stat-chip stat-chip--ok"><b class="num" id="s-enplazo">0</b><span>En plazo</span></div>
      <div class="stat-chip stat-chip--bad"><b class="num" id="s-vencidas">0</b><span>Vencidas</span></div>
    </div>
    <h2 class="h6">Por estado</h2>
    <ul id="lista-estado" class="mb-4"></ul>
    <h2 class="h6">Por comuna</h2>
    <ul id="lista-comuna"></ul>
  </main>
  <script type="module" src="/js/estadisticas.js"></script>
</body>
</html>
