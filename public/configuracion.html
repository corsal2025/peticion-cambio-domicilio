<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Configuración — Cambio de domicilio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="/index.html">
        <img src="/img/logo-municipal.png" alt="" style="height:32px;vertical-align:middle;margin-right:.5rem;" />
        Peticiones
      </a>
      <div class="d-flex align-items-center gap-2">
        <a class="nav-link" href="/index.html">Peticiones</a>
        <a class="nav-link" href="/comunas.html">Comunas</a>
        <a class="nav-link" href="/estadisticas.html">Estadísticas</a>
        <a class="nav-link active" href="/configuracion.html">Configuración</a>
      </div>
    </div>
  </nav>
  <main class="container" style="max-width:640px;">
    <h1 class="h4 mb-3">Configuración (solo admin)</h1>

    <div id="mensaje" class="alert" style="display:none;"></div>

    <form id="form-config" class="card mb-4">
      <div class="card-body">
        <div class="mb-2">
          <label class="form-label">Modo de correo</label>
          <select name="mail.mode" class="form-select form-select-sm">
            <option value="relay">relay (proceso .exe local hace el envío)</option>
            <option value="direct">direct (el Worker envía directo a EWS)</option>
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label">Correo de prueba (mail.test_email)</label>
          <input name="mail.test_email" class="form-control form-control-sm" placeholder="vacío = envío real" />
        </div>
        <div class="mb-2">
          <label class="form-label">Enviar como (mail.send_as, solo modo direct)</label>
          <input name="mail.send_as" class="form-control form-control-sm" />
        </div>
        <button class="btn btn-sm btn-primary">Guardar</button>
        <button type="button" id="btn-prueba" class="btn btn-sm btn-outline-secondary">Enviar correo de prueba</button>
      </div>
    </form>

    <h2 class="h6">Usuarios</h2>
    <form id="form-usuario" class="d-flex gap-2 mb-2">
      <input name="usuario" placeholder="usuario" class="form-control form-control-sm" required />
      <input name="nombre" placeholder="nombre" class="form-control form-control-sm" />
      <select name="rol" class="form-select form-select-sm" style="max-width:120px;">
        <option value="staff">staff</option>
        <option value="admin">admin</option>
      </select>
      <input name="clave" type="password" placeholder="clave" class="form-control form-control-sm" required />
      <button class="btn btn-sm btn-primary">Crear</button>
    </form>
    <ul id="lista-usuarios"></ul>
  </main>
  <script type="module" src="/js/configuracion.js"></script>
</body>
</html>
